baseURL        = 'https://www.polypompholyx.com/'
title          = 'Polypompholyx'
languageCode   = 'en-GB'
defaultContentLanguage = 'en'
copyright      = 'Except where otherwise noted, content on this site is licensed under a Creative Commons CC-BY-SA-3.0 licence, Steve Cook'
enableRobotsTXT = true
summaryLength  = 60

# --- Theme: Ananke, installed as a Hugo Module (see go.mod / README) -------
# Prefer a git submodule instead?  Delete this [module] block, add
#   theme = 'ananke'
# and see README.md, "Option B".
[module]
  [[module.imports]]
    path = 'github.com/gohugo-ananke/ananke/v2'

[pagination]
  pagerSize = 10

# --- Taxonomies: keep the WordPress URLs  /category/<slug>/  /tag/<slug>/ ---
[taxonomies]
  category = 'categories'
  tag      = 'tags'

[permalinks.taxonomy]
  categories = '/category/'
  tags       = '/tag/'
[permalinks.term]
  categories = '/category/:slug/'
  tags       = '/tag/:slug/'

# --- Markdown ---------------------------------------------------------------
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true            # posts contain raw <figure>, <video>, <sup> etc.
  [markup.highlight]
    style = 'friendly'
    guessSyntax = false

# --- Feeds: WordPress served /feed/ ; Hugo will now serve /feed.xml ---------
[outputs]
  home    = ['html', 'rss']
  section = ['html', 'rss']
[outputFormats.RSS]
  baseName = 'feed'

# --- Menu (same four items as the WordPress site) ---------------------------
[menus]
  [[menus.main]]
    name   = 'Home'
    url    = '/'
    weight = 1
  [[menus.main]]
    name   = 'About'
    url    = '/about/'
    weight = 2
  [[menus.main]]
    name   = 'Perl'
    url    = '/perl/'
    weight = 3
  [[menus.main]]
    name   = 'R'
    url    = '/r/'
    weight = 4

# --- Parameters -------------------------------------------------------------
[params]
  mainSections      = ['posts']
  author            = 'polypompholyx'
  banner_image      = '/wp-content/uploads/2012/04/victoria_amazonica.jpg'
  body_classes      = 'sans-serif'
  disable_share     = true
  show_reading_time = false
  instagram         = 'https://www.instagram.com/polypompholyx'

  [params.ananke]
    custom_css = ['custom.css']

  [[params.blogroll]]
    name = 'Alex Lomas'
    url  = 'http://www.alexlomas.com/blog/'

[caches]
  [caches.images]
    dir = ':cacheDir/images'
